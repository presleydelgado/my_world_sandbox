<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Universo Sandbox Plano</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: sans-serif;
            user-select: none;
        }

        /* O "Mundo" que se move, recebe zoom e o fundo personalizado */
        #mundo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
            background-color: #e0e0e0;
            background-size: cover;
            background-position: center;
        }

        /* Menu de instruções com transição suave para esconder */
        #instrucoes {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 999999;
            max-width: 300px;
            transition: transform 0.3s ease;
        }

        /* Classe que será aplicada para esconder o menu */
        #instrucoes.escondido {
            transform: translateX(-330px);
        }

        /* Botão de alternar (Fixado na borda do menu) */
        .btn-alternar-menu {
            position: absolute;
            top: 10px;
            right: -40px;
            width: 35px;
            height: 35px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 3px 0 5px rgba(0,0,0,0.1);
        }
        .btn-alternar-menu:hover { background: #357ABD; }

        .botoes-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        /* Containers de Configurações */
        .config-container {
            margin: 10px 0;
            padding: 5px 0;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .config-container label {
            font-size: 13px;
            font-weight: bold;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-container input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Estilização das Caixinhas de Seleção (Fieldset) */
        .caixa-fundo {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 8px 10px;
            margin-top: 5px;
            background: #fafafa;
        }
        .caixa-fundo legend {
            font-size: 11px;
            font-weight: bold;
            color: #555;
            padding: 0 5px;
            text-transform: uppercase;
        }

        .input-fundo-texto {
            width: 100%;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 12px;
            margin-top: 2px;
        }
        .input-cor {
            border: none;
            width: 100%;
            height: 25px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        button {
            background: #4A90E2;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
        }
        button:hover { background: #357ABD; }

        .btn-organizar { background: #2ECC71; }
        .btn-organizar:hover { background: #27AE60; }

        .btn-limpar { background: #E74C3C; }
        .btn-limpar:hover { background: #C0392B; }

        #input-arquivo { display: none; }

        /* Elementos colocados no jogo */
        .elemento-jogo {
            position: absolute;
            cursor: move;
            width: 250px;
            box-sizing: border-box;
        }

        .animar-posicao {
            transition: top 0.4s ease, left 0.4s ease;
        }

        .elemento-jogo:focus {
            outline: none;
            border: 3px solid #4A90E2;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.5);
        }
    </style>
</head>
<body>

    <div id="instrucoes">
        <button class="btn-alternar-menu" onclick="alternarMenu()" title="Esconder/Mostrar Menu">◀</button>

        <h3>Menu Sandbox</h3>
        <div id="conteudo-menu" style="max-height: 80vh; overflow-y: auto; padding-right: 5px;">
            <p style="font-size: 12px; margin: 4px 0;">📋 <strong>Ctrl + V</strong> ou <strong>Arraste arquivos</strong>.</p>
            <p style="font-size: 12px; margin: 4px 0;">🖱️ <strong>Botão Esquerdo:</strong> Move os objetos.</p>
            <p style="font-size: 12px; margin: 4px 0;">🎥 <strong>Botão Direito:</strong> Move a câmera.</p>
            <p style="font-size: 12px; margin: 4px 0;">🎡 <strong>Rodinha no item:</strong> Altera o tamanho.</p>
            <p style="font-size: 12px; margin: 4px 0;">❌ <strong>Clique + Delete:</strong> Apaga o objeto.</p>

            <div class="config-container">
                <label for="slider-zoom">🔍 Zoom do Campo: <span id="val-zoom">100%</span></label>
                <input type="range" id="slider-zoom" min="0.2" max="3" step="0.05" value="1" oninput="ajustarZoomCampo(this.value)">
            </div>

            <div class="config-container" style="border-bottom: 1px solid #ddd; padding-bottom: 12px;">

                <fieldset class="caixa-fundo">
                    <legend>🎨 Cor do Fundo</legend>
                    <input type="color" id="seletor-cor" value="#e0e0e0" class="input-cor" oninput="mudarCorFundo(this.value)">
                </fieldset>

                <fieldset class="caixa-fundo">
                    <legend>🖼️ Imagem de Fundo (URL)</legend>
                    <input type="text" id="url-fundo" placeholder="Cole o link da imagem..." class="input-fundo-texto" onchange="mudarImagemFundo(this.value)">
                </fieldset>

            </div>

            <div class="botoes-container">
                <button class="btn-organizar" onclick="organizarElementosEmGrade()">🗂️ Organizar Itens (Espaço 0)</button>
                <button class="btn-limpar" onclick="limparTodoOMundo()">🗑️ Limpar Todo o Espaço</button>
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 5px 0;">
                <button onclick="salvarMundoParaArquivo()">💾 Baixar Arquivo de Salvamento</button>
                <button onclick="document.getElementById('input-arquivo').click()">📂 Carregar Arquivo do PC</button>
                <input type="file" id="input-arquivo" accept=".json" onchange="carregarMundoDeArquivo(event)">
            </div>
        </div>
    </div>

    <div id="mundo"></div>

    <script>
        const mundo = document.getElementById('mundo');
        const menuInstrucoes = document.getElementById('instrucoes');
        const sliderZoom = document.getElementById('slider-zoom');
        const valZoom = document.getElementById('val-zoom');
        const seletorCor = document.getElementById('seletor-cor');
        const urlFundo = document.getElementById('url-fundo');

        let elementoArrastando = null;
        let offsetX = 0, offsetY = 0;
        let maiorZIndex = 1;

        // Variáveis da Câmera (Pan) e Zoom do Campo
        let arrastandoCamera = false;
        let cameraX = 0, cameraY = 0;
        let cameraStartX = 0, cameraStartY = 0;
        let zoomCampo = 1;

        // Variáveis de estilo de fundo salvas
        let corFundoAtual = "#e0e0e0";
        let imagemFundoAtual = "";

        // --- FUNÇÕES DE CUSTOMIZAÇÃO DO FUNDO ---
        function mudarCorFundo(cor) {
            corFundoAtual = cor;
            mundo.style.backgroundColor = cor;
        }

        function mudarImagemFundo(url) {
            imagemFundoAtual = url;
            if(url.trim() === "") {
                mundo.style.backgroundImage = "none";
            } else {
                mundo.style.backgroundImage = `url('${url}')`;
            }
        }

        // --- FUNÇÃO PARA ESCONDER / MOSTRAR O MENU ---
        function toggleMenu() { // Mantido compatibilidade interna se necessário
            alternarMenu();
        }
        function alternarMenu() {
            const botao = document.querySelector('.btn-alternar-menu');
            menuInstrucoes.classList.toggle('escondido');
            botao.innerText = menuInstrucoes.classList.contains('escondido') ? '▶' : '◀';
        }

        // --- SISTEMA DE ZOOM DO CAMPO (SLIDER) ---
        function atualizarMundo() {
            mundo.style.transform = `translate(${cameraX}px, ${cameraY}px) scale(${zoomCampo})`;
        }

        function ajustarZoomCampo(valor) {
            zoomCampo = parseFloat(valor);
            valZoom.innerText = `${Math.round(zoomCampo * 100)}%`;
            atualizarMundo();
        }

        // --- FUNÇÃO AUTO-FILL (ORGANIZAR EM GRADE - ESPAÇO ZERO) ---
        function organizarElementosEmGrade() {
            const elementos = document.querySelectorAll('.elemento-jogo');
            if (elementos.length === 0) return;

            cameraX = 0;
            cameraY = 0;
            atualizarMundo();

            const margemEsquerdaInicial = 0;
            const margemTopoInicial = 0;
            const espacamentoX = 0;
            const espacamentoY = 0;
            const larguraMaxJanela = window.innerWidth;

            let xAtual = margemEsquerdaInicial;
            let yAtual = margemTopoInicial;
            let maiorAlturaNaLinha = 0;

            elementos.forEach((el) => {
                el.classList.add('animar-posicao');

                const escalaItem = parseFloat(el.dataset.escala) || 1;
                const larguraRealItem = 250 * escalaItem;
                const alturaRealItem = (el.offsetHeight || 180) * escalaItem;

                if (xAtual + larguraRealItem > larguraMaxJanela && xAtual > margemEsquerdaInicial) {
                    xAtual = margemEsquerdaInicial;
                    yAtual += maiorAlturaNaLinha + espacamentoY;
                    maiorAlturaNaLinha = 0;
                }

                el.style.left = `${xAtual}px`;
                el.style.top = `${yAtual}px`;

                if (alturaRealItem > maiorAlturaNaLinha) {
                    maiorAlturaNaLinha = alturaRealItem;
                }

                xAtual += larguraRealItem + espacamentoX;

                setTimeout(() => {
                    el.classList.remove('animar-posicao');
                }, 400);
            });
        }

        // --- FUNÇÃO PARA LIMPAR TODO O MUNDO ---
        function limparTodoOMundo() {
            const elementos = document.querySelectorAll('.elemento-jogo');
            if (elementos.length === 0) return;

            const confirmar = confirm(`Você tem certeza que deseja deletar todos os ${elementos.length} itens da tela?`);
            if (confirmar) {
                mundo.innerHTML = '';
                cameraX = 0; cameraY = 0; zoomCampo = 1; maiorZIndex = 1;
                sliderZoom.value = 1;
                valZoom.innerText = "100%";
                atualizarMundo();
            }
        }

        // --- ENTRADA DE ARQUIVOS ---
        window.addEventListener('paste', (e) => {
            tratarArquivos(e.clipboardData.items, (window.innerWidth/2 - cameraX) / zoomCampo, (window.innerHeight/2 - cameraY) / zoomCampo);
        });

        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const xReal = (e.clientX - cameraX) / zoomCampo;
                const yReal = (e.clientY - cameraY) / zoomCampo;
                tratarArquivos(e.dataTransfer.items, xReal, yReal);
            }
        });

        function tratarArquivos(itens, x, y) {
            for (let i = 0; i < itens.length; i++) {
                const arquivoBlob = itens[i].getAsFile();
                if (!arquivoBlob) continue;

                const leitor = new FileReader();
                const tipo = itens[i].type.indexOf('image') !== -1 ? 'img' : (itens[i].type.indexOf('video') !== -1 ? 'video' : null);

                if (tipo) {
                    leitor.onload = function(event) {
                        criarElemento(tipo, event.target.result, x, y);
                    };
                    leitor.readAsDataURL(arquivoBlob);
                }
            }
        }

        // --- CRIAÇÃO DE ELEMENTOS ---
        function criarElemento(tipo, src, x = 150, y = 150, escala = 1, zIndex = null) {
            const el = document.createElement(tipo);
            el.src = src;
            el.className = 'elemento-jogo';
            el.tabIndex = 0;

            el.style.left = `${x}px`;
            el.style.top = `${y}px`;

            if (tipo === 'video') {
                el.autoplay = true; el.loop = true; el.muted = true; el.playsInline = true;
                el.addEventListener('contextmenu', (e) => {
                    if (e.ctrlKey) e.stopPropagation();
                    else e.preventDefault();
                });
            }

            if (zIndex) {
                el.style.zIndex = zIndex;
                if (zIndex > maiorZIndex) maiorZIndex = zIndex;
            } else {
                el.style.zIndex = maiorZIndex++;
            }

            el.dataset.escala = escala;
            el.style.transform = `scale(${escala})`;

            el.addEventListener('mousedown', iniciarArrastoObjeto);
            el.addEventListener('wheel', ajustarTamanho);
            el.addEventListener('keydown', deletarElemento);
            el.addEventListener('dragstart', (e) => e.preventDefault());

            mundo.appendChild(el);
            return el;
        }

        function ajustarTamanho(e) {
            e.preventDefault();
            e.stopPropagation();
            let escalaAtual = parseFloat(e.target.dataset.escala);
            escalaAtual += (e.deltaY < 0) ? 0.1 : -0.1;
            escalaAtual = Math.max(0.15, Math.min(4, escalaAtual));

            e.target.dataset.escala = escalaAtual;
            e.target.style.transform = `scale(${escalaAtual})`;
        }

        document.addEventListener('keydown', deletarElemento);
        function deletarElemento(e) {
            if ((e.key === 'Delete' || e.key === 'Backspace') && document.activeElement.classList.contains('elemento-jogo')) {
                document.activeElement.remove();
            }
        }

        // --- MOVIMENTAR OBJETOS ---
        function iniciarArrastoObjeto(e) {
            if (e.button !== 0) return;
            e.stopPropagation();

            elementoArrastando = e.target;
            elementoArrastando.focus();

            maiorZIndex++;
            elementoArrastando.style.zIndex = maiorZIndex;

            offsetX = (e.clientX / zoomCampo) - elementoArrastando.offsetLeft;
            offsetY = (e.clientY / zoomCampo) - elementoArrastando.offsetTop;

            window.addEventListener('mousemove', arrastarObjeto);
            window.addEventListener('mouseup', pararArrastoObjeto);
        }

        function arrastarObjeto(e) {
            if (elementoArrastando) {
                elementoArrastando.style.left = ((e.clientX / zoomCampo) - offsetX) + 'px';
                elementoArrastando.style.top = ((e.clientY / zoomCampo) - offsetY) + 'px';
            }
        }

        function pararArrastoObjeto() {
            elementoArrastando = null;
            window.removeEventListener('mousemove', arrastarObjeto);
            window.removeEventListener('mouseup', pararArrastoObjeto);
        }

        // --- MOVIMENTAR CÂMERA ---
        window.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('mousedown', (e) => {
            if (e.button === 2 && !e.ctrlKey) {
                arrastandoCamera = true;
                cameraStartX = e.clientX - cameraX;
                cameraStartY = e.clientY - cameraY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!arrastandoCamera) return;
            cameraX = e.clientX - cameraStartX;
            cameraY = e.clientY - cameraStartY;
            atualizarMundo();
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2) arrastandoCamera = false;
        });

        // --- SISTEMA DE SALVAR E CARREGAR ---
        function salvarMundoParaArquivo() {
            const elementos = document.querySelectorAll('.elemento-jogo');
            const dadosParaSalvar = [];

            elementos.forEach(el => {
                dadosParaSalvar.push({
                    tipo: el.tagName.toLowerCase(),
                    src: el.src,
                    x: parseInt(el.style.left),
                    y: parseInt(el.style.top),
                    escala: el.dataset.escala,
                    zIndex: el.style.zIndex
                });
            });

            const estruturaCompleta = {
                cameraX, cameraY, zoomCampo, maiorZIndex,
                corFundoAtual, imagemFundoAtual,
                elementos: dadosParaSalvar
            };

            const textoDados = JSON.stringify(estruturaCompleta);
            const blob = new Blob([textoDados], { type: 'application/json' });
            const urlDownload = URL.createObjectURL(blob);

            const linkInvisivel = document.createElement('a');
            linkInvisivel.href = urlDownload;
            linkInvisivel.download = 'meu_mundo_sandbox.json';
            document.body.appendChild(linkInvisivel);
            linkInvisivel.click();
            document.body.removeChild(linkInvisivel);
        }

        function carregarMundoDeArquivo(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();
            leitor.onload = function(e) {
                const dados = JSON.parse(e.target.result);
                mundo.innerHTML = '';

                cameraX = dados.cameraX || 0;
                cameraY = dados.cameraY || 0;
                zoomCampo = dados.zoomCampo || 1;
                maiorZIndex = dados.maiorZIndex || 1;

                corFundoAtual = dados.corFundoAtual || "#e0e0e0";
                imagemFundoAtual = dados.imagemFundoAtual || "";

                seletorCor.value = corFundoAtual;
                urlFundo.value = imagemFundoAtual;

                mudarCorFundo(corFundoAtual);
                mudarImagemFundo(imagemFundoAtual);

                sliderZoom.value = zoomCampo;
                valZoom.innerText = `${Math.round(zoomCampo * 100)}%`;

                atualizarMundo();

                dados.elementos.forEach(d => {
                    criarElemento(d.tipo, d.src, d.x, d.y, d.escala, d.zIndex);
                });
            };
            leitor.readAsText(arquivo);
            event.target.value = '';
        }

        atualizarMundo();
    </script>
</body>
</html>
